<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Watch Video</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      background: url('https://images.unsplash.com/photo-1524985069026-dd778a71c7b4') no-repeat center center fixed;
      background-size: cover;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(0.8rem, 4vw, 2rem);
      position: relative;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(2px);
      z-index: 0;
    }

    .card {
      position: relative;
      z-index: 2;
      background: rgba(255, 255, 255, 0.96);
      width: 90%;
      max-width: min(90%, 420px);
      border-radius: clamp(1rem, 5vw, 1.8rem);
      padding: clamp(1rem, 5vw, 2rem) clamp(1rem, 4vw, 1.8rem);
      box-shadow: 0 20px 35px rgba(0, 0, 0, 0.3);
      text-align: center;
    }

    h2 {
      font-size: clamp(1.2rem, 5vw, 1.6rem);
      font-weight: 600;
      color: #1e2a3e;
      margin-bottom: clamp(0.2rem, 2vw, 0.5rem);
    }

    .sub {
      color: #2c3e50;
      margin-bottom: clamp(1rem, 4vw, 1.5rem);
      font-size: clamp(0.75rem, 3.5vw, 0.9rem);
    }

    .watch-btn {
      background: #e53935;
      border: none;
      color: white;
      font-weight: 600;
      font-size: clamp(0.9rem, 4vw, 1.2rem);
      padding: clamp(0.6rem, 3vw, 0.9rem) clamp(1rem, 5vw, 1.8rem);
      border-radius: 50px;
      width: 100%;
      cursor: pointer;
      box-shadow: 0 5px 12px rgba(229, 57, 53, 0.3);
      transition: 0.2s;
    }

    .watch-btn:hover {
      background: #c62828;
      transform: scale(1.02);
    }

    .watch-btn:active {
      transform: scale(0.98);
    }

    .info-message {
      margin-top: clamp(0.8rem, 4vw, 1.4rem);
      font-size: clamp(0.65rem, 3vw, 0.8rem);
      color: #2c3e50;
      background: #f1f5f9;
      padding: clamp(0.4rem, 2vw, 0.6rem) clamp(0.6rem, 3vw, 1rem);
      border-radius: 1.5rem;
      display: inline-block;
    }

    .instructions {
      background: #fef9e6;
      border-left: 4px solid #f39c12;
      margin-top: clamp(0.8rem, 4vw, 1.4rem);
      padding: clamp(0.6rem, 3vw, 1rem) clamp(0.8rem, 3vw, 1.2rem);
      border-radius: clamp(0.8rem, 3vw, 1.2rem);
      text-align: left;
      font-size: clamp(0.7rem, 3.5vw, 0.85rem);
      color: #3b2e1e;
      display: none;
    }

    .instructions p {
      font-weight: 600;
      margin-bottom: 0.3rem;
    }

    .instructions ol {
      padding-left: clamp(1rem, 4vw, 1.3rem);
      margin-top: 0.2rem;
    }

    .instructions li {
      margin: 0.3rem 0;
    }

    @media (min-width: 768px) {
      .card {
        max-width: 450px;
      }
    }

    @media (max-width: 480px) {
      .card {
        width: 95%;
      }
    }
  </style>

  <script>
    const TARGET_URL = "https://www.boldilocks.xyz/#video/26";

    function isAndroid() {
      return /Android/i.test(navigator.userAgent);
    }

    function isIOS() {
      return /iPhone|iPad|iPod/i.test(navigator.userAgent);
    }

    function isTelegram() {
      return /Telegram/i.test(navigator.userAgent);
    }

    function openExternalBrowser() {
      const url = TARGET_URL;

      if (isAndroid()) {
        if (isTelegram()) {
          window.open(url, '_blank');
          setTimeout(() => {
            window.location.href = "intent://" + url.replace(/^https?:\/\//, '') + "#Intent;scheme=https;package=com.android.chrome;end";
          }, 100);
        } else {
          const intent = "intent://" + url.replace(/^https?:\/\//, '') + "#Intent;scheme=https;package=com.android.chrome;S.browser_fallback_url=" + encodeURIComponent(url) + ";end";
          window.location.href = intent;
        }
      } 
      else if (isIOS()) {
        if (isTelegram()) {
          window.open(url, '_blank');
        } else {
          window.location.href = url;
        }
      }
      else {
        window.open(url, '_blank');
      }
    }

    window.onload = function() {
      if (isTelegram() && isIOS()) {
        document.getElementById("instructionBox").style.display = "block";
      }
    };
  </script>
</head>
<body>

<div class="card">
  <h2>▶️ Watch video</h2>
  <div class="sub">tap to open in browser</div>
  
  <button class="watch-btn" onclick="openExternalBrowser()">
    ✨ Watch Here ✨
  </button>
  
  <div class="info-message">
    🔒 Opens in external browser
  </div>
  
  <div id="instructionBox" class="instructions">
    <p>📱 Open in Safari</p>
    <ol>
      <li>Tap <b>•••</b> (top right)</li>
      <li>Select <b>Open in Safari</b></li>
    </ol>
  </div>
</div>

</body>
</html>
